<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeanette's Portfolio</title>
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/home.css" />
    <link rel="stylesheet" href="css/features/dock.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body data-page="home" data-logo="top">
    <nav id="site-nav"></nav>
    <script src="data/site.js"></script>
    <script src="js/site-shell.js"></script>

    <header class="home-page-header">
      <img src="img/profile/dp_2.jpeg" alt="Jeanette's photo" />
      <h1>Hi! I am Jeanette.</h1>
      <p>I dabble in design <span class="wave">🤘</span></p>
    </header>

    <section class="dock-strip" aria-labelledby="dock-title">
      <div class="dock-inner">
        <h2 class="dock-tag" id="dock-title">My Dock</h2>
        <ul class="dock-list">
          <li class="dock-item">
            <button class="dock-btn" type="button" data-popup="tools">
              <span class="dock-tile"
                ><img class="dock-icon" src="img/dock/tools.svg" alt=""
              /></span>
              <span class="dock-label">Tools</span>
            </button>
          </li>
          <li class="dock-item">
            <button class="dock-btn" type="button" data-popup="doodles">
              <span class="dock-tile"
                ><img class="dock-icon" src="img/dock/doodles.svg" alt=""
              /></span>
              <span class="dock-label">Doodles</span>
            </button>
          </li>
          <li class="dock-item">
            <button class="dock-btn" type="button" data-popup="gallery">
              <span class="dock-tile"
                ><img class="dock-icon" src="img/dock/gallery.svg" alt=""
              /></span>
              <span class="dock-label">Gallery</span>
            </button>
          </li>
          <li class="dock-item">
            <button class="dock-btn" type="button" data-popup="map">
              <span class="dock-tile"><img class="dock-icon" src="img/dock/map.svg" alt="" /></span>
              <span class="dock-label">Map</span>
            </button>
          </li>
          <li class="dock-item">
            <button class="dock-btn" type="button" data-popup="off-the-clock">
              <span class="dock-tile"
                ><img class="dock-icon" src="img/dock/off-the-clock.svg" alt=""
              /></span>
              <span class="dock-label">Off the clock</span>
            </button>
          </li>
          <li class="dock-item">
            <button class="dock-btn" type="button" data-popup="palette">
              <span class="dock-tile"
                ><img class="dock-icon" src="img/dock/palette.svg" alt=""
              /></span>
              <span class="dock-label">Palette</span>
            </button>
          </li>
        </ul>
      </div>
    </section>

    <main class="featured-projects">
      <h3>
        <span class="separator">&#9729;</span> Selected Works <span class="separator">&#9729;</span>
      </h3>

      <!-- Projects are injected here by js/render-projects.js -->
      <div id="featured-projects-list"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="data/projects.js"></script>
    <script src="js/render-projects.js"></script>
    <script>
      renderFeatured('#featured-projects-list');
    </script>
  </body>
</html>
